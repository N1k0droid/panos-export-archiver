zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: cecc260486f2471cbf479fe4e9b5f240
      name: Templates/Applications
  templates:
    - uuid: 0963b4b2a5d441c8910d729f3702fa73
      template: 'PAN-OS CSV Archiver by Zabbix trapper'
      name: 'PAN-OS CSV Archiver by Zabbix trapper'
      description: 'Discovery-based monitoring of the Palo Alto CSV archive jobs (panos_csv_archiver.bat 1.0.0).'
      vendor:
        name: N1k0droid
        version: 1.0.0
      groups:
        - name: Templates/Applications
      discovery_rules:
        - uuid: be55c97356564f6380f26bca075a3f1c
          name: 'CSV Archiver instance discovery'
          type: TRAP
          key: panos.csv.discovery
          delay: '0'
          allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
          lifetime: 45d
          description: 'Receives the complete instance registry as JSON from the shared batch script.'
          item_prototypes:
            - uuid: 7c5b14c950b041b388ecf74e5d3fb667
              name: 'CSV Archiver [{#INSTANCE}]: Archives created'
              type: TRAP
              key: 'panos.csv.archive.count[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              tags:
                - tag: component
                  value: storage
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
            - uuid: eac0fedbed3d432fb22875fc5716b871
              name: 'CSV Archiver [{#INSTANCE}]: Invalid archives set aside'
              type: TRAP
              key: 'panos.csv.archive.invalid[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              description: 'Incomplete or foreign archives renamed to *.7z.invalid-<epoch> during recovery. They are never deleted automatically'
              tags:
                - tag: component
                  value: storage
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
              trigger_prototypes:
                - uuid: cd34f2c93d824dbe87ea594978609673
                  expression: 'last(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.archive.invalid[{#INSTANCE}])>0'
                  name: 'CSV Archiver [{#INSTANCE}]: Invalid archives set aside, manual review needed'
                  priority: WARNING
                  description: 'Recovery found an archive that was incomplete or did not match its CSV. It was renamed to *.7z.invalid-<epoch> and the CSV was archived again. Check and delete the renamed file manually.'
                  tags:
                    - tag: template
                      value: Pan-OS-CSV-Archiver
            - uuid: b11dd5099a2345cc8d25a13d20dd1c3f
              name: 'CSV Archiver [{#INSTANCE}]: Last archive size'
              type: TRAP
              key: 'panos.csv.archive.last.size[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              units: B
              tags:
                - tag: component
                  value: storage
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
            - uuid: defc2829944f4ad188b6ec108f7a5069
              name: 'CSV Archiver [{#INSTANCE}]: Oldest archived day'
              type: TRAP
              key: 'panos.csv.archive.oldest[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              units: unixtime
              description: 'Local midnight of the oldest day folder containing archives (0 = none). Used to plan manual rotation'
              tags:
                - tag: component
                  value: storage
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
              trigger_prototypes:
                - uuid: b7e19ce011684edfbb98386428d4ab7b
                  expression: 'last(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.archive.oldest[{#INSTANCE}])>0 and (now()-last(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.archive.oldest[{#INSTANCE}]))>{$PANOS.CSV.ARCHIVE.ROTATION.AGE}'
                  name: 'CSV Archiver [{#INSTANCE}]: Archives older than retention, manual rotation due'
                  priority: INFO
                  tags:
                    - tag: template
                      value: Pan-OS-CSV-Archiver
            - uuid: 6fed1f3216c1471997ae52dbd316a5e2
              name: 'CSV Archiver [{#INSTANCE}]: Archive total files'
              type: TRAP
              key: 'panos.csv.archive.total.files[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              description: 'Number of .7z archives under the source directory'
              tags:
                - tag: component
                  value: storage
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
            - uuid: 5c2e73bfd23b4d61bfab16062c81d686
              name: 'CSV Archiver [{#INSTANCE}]: Archive total size'
              type: TRAP
              key: 'panos.csv.archive.total.size[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              units: B
              description: 'Total size of all .7z archives under the source directory'
              tags:
                - tag: component
                  value: storage
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
            - uuid: 99300eed6e51429baacd74e518b2eb82
              name: 'CSV Archiver [{#INSTANCE}]: Bytes processed'
              type: TRAP
              key: 'panos.csv.bytes.processed[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              units: B
              tags:
                - tag: component
                  value: job
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
            - uuid: 7250f41248e64e04a9b6dc0b43413a90
              name: 'CSV Archiver [{#INSTANCE}]: Path guard detail'
              type: TRAP
              key: 'panos.csv.check.path.detail[{#INSTANCE}]'
              delay: '0'
              history: 30d
              value_type: TEXT
              trends: '0'
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              description: 'Reason of the path guard decision'
              tags:
                - tag: component
                  value: health
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
            - uuid: 8edc607e693d4659a100a7f6dbc51640
              name: 'CSV Archiver [{#INSTANCE}]: Path guard status'
              type: TRAP
              key: 'panos.csv.check.path[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              description: '1 paths accepted, 0 source or log directory rejected because not on a local disk'
              valuemap:
                name: 'CSV Archiver check result'
              tags:
                - tag: component
                  value: health
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
              trigger_prototypes:
                - uuid: f26e19ba8eb843ecb0670ad2eff3f0d3
                  expression: 'last(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.check.path[{#INSTANCE}])=0'
                  name: 'CSV Archiver [{#INSTANCE}]: Path rejected, not on a local disk'
                  priority: HIGH
                  description: 'The source or log directory is a UNC path, a network drive or a link to a remote target while ALLOW_REMOTE_PATHS=0. No file was touched. See item Path guard detail.'
                  tags:
                    - tag: template
                      value: Pan-OS-CSV-Archiver
            - uuid: ae82cc08c7694d5bbfab58121f3b8c21
              name: 'CSV Archiver [{#INSTANCE}]: Prerequisites detail'
              type: TRAP
              key: 'panos.csv.check.prereq.detail[{#INSTANCE}]'
              delay: '0'
              history: 30d
              value_type: TEXT
              trends: '0'
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              description: 'OK or list of missing / not executable programs'
              tags:
                - tag: component
                  value: health
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
            - uuid: 503c87018fca46788861f95c194019fc
              name: 'CSV Archiver [{#INSTANCE}]: Prerequisites status'
              type: TRAP
              key: 'panos.csv.check.prereq[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              description: '1 all required programs available, 0 something missing (see Prerequisites detail)'
              valuemap:
                name: 'CSV Archiver check result'
              tags:
                - tag: component
                  value: health
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
              trigger_prototypes:
                - uuid: 44760cbc22764c6f9d6ee5554d136e1a
                  expression: 'last(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.check.prereq[{#INSTANCE}])=0'
                  name: 'CSV Archiver [{#INSTANCE}]: Required programs missing'
                  priority: HIGH
                  description: 'The job cannot run: 7-Zip (or its options) or a required Windows program is missing or blocked. See item Prerequisites detail. A missing zabbix_sender does not stop the archiving: it raises No recent job metrics.'
                  tags:
                    - tag: template
                      value: Pan-OS-CSV-Archiver
            - uuid: 82d809838ece459fbc1d87bc41d85b4b
              name: 'CSV Archiver [{#INSTANCE}]: Compression ratio'
              type: TRAP
              key: 'panos.csv.compression.ratio[{#INSTANCE}]'
              delay: '0'
              history: 30d
              value_type: FLOAT
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              units: '%'
              description: 'Archive size as a percentage of the original CSV size, for the files archived in the last run (not sent when no file was archived)'
              tags:
                - tag: component
                  value: job
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
            - uuid: 3dcc8c2cef2d4ad5babf246fd8f85fb9
              name: 'CSV Archiver [{#INSTANCE}]: Last complete day'
              type: TRAP
              key: 'panos.csv.day.date[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              units: unixtime
              description: 'Local midnight of the day counted by "Files of the last complete day"'
              tags:
                - tag: component
                  value: job
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
            - uuid: cbf5b798363048f590efaf1d268abef1
              name: 'CSV Archiver [{#INSTANCE}]: Files of the last complete day'
              type: TRAP
              key: 'panos.csv.day.files[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              description: 'Archives in the day folder of the most recent complete day (see DAY_COUNT_LAG_DAYS and DAY_COMPLETE_HOUR in the script). Sent at every run.'
              tags:
                - tag: component
                  value: job
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
              trigger_prototypes:
                - uuid: 0ffe19307de2478b809001e409cf26f3
                  expression: 'avg(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.day.files[{#INSTANCE}],{$PANOS.CSV.DAY.FILES.BASELINE:"{#INSTANCE}"}:now-1d)>0 and last(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.day.files[{#INSTANCE}])<avg(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.day.files[{#INSTANCE}],{$PANOS.CSV.DAY.FILES.BASELINE:"{#INSTANCE}"}:now-1d)*(100-{$PANOS.CSV.DAY.FILES.CHANGE.PCT:"{#INSTANCE}"})/100'
                  name: 'CSV Archiver [{#INSTANCE}]: Daily CSV files decreased by more than {$PANOS.CSV.DAY.FILES.CHANGE.PCT:"{#INSTANCE}"}%'
                  event_name: 'CSV Archiver [{#INSTANCE}]: Daily CSV files decreased: {ITEM.LASTVALUE1} vs average {{?avg(/{HOST.HOST}/panos.csv.day.files[{#INSTANCE}],{$PANOS.CSV.DAY.FILES.BASELINE:"{#INSTANCE}"}:now-1d)}.fmtnum(0)}'
                  opdata: 'Files: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The number of files of the last complete day is much lower than the average of the previous days ({$PANOS.CSV.DAY.FILES.BASELINE:"{#INSTANCE}"}). 0 files means that the export of the firewall did not arrive or was not archived.'
                  dependencies:
                    - name: 'CSV Archiver [{#INSTANCE}]: No new CSV files for {$PANOS.CSV.NO.FILES.MAX.AGE:"{#INSTANCE}"}'
                      expression: 'max(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.files.processed[{#INSTANCE}],{$PANOS.CSV.NO.FILES.MAX.AGE:"{#INSTANCE}"})=0 and count(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.files.processed[{#INSTANCE}],#1:now-{$PANOS.CSV.NO.FILES.MAX.AGE:"{#INSTANCE}"})=1'
                    - name: 'CSV Archiver [{#INSTANCE}]: No recent job metrics'
                      expression: 'nodata(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.job.status[{#INSTANCE}],{$PANOS.CSV.JOB.MAX.AGE:"{#INSTANCE}"})=1'
                  tags:
                    - tag: template
                      value: Pan-OS-CSV-Archiver
                - uuid: 5af1f9e18e62472682220fc5b2f5b745
                  expression: 'avg(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.day.files[{#INSTANCE}],{$PANOS.CSV.DAY.FILES.BASELINE:"{#INSTANCE}"}:now-1d)>0 and last(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.day.files[{#INSTANCE}])>avg(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.day.files[{#INSTANCE}],{$PANOS.CSV.DAY.FILES.BASELINE:"{#INSTANCE}"}:now-1d)*(100+{$PANOS.CSV.DAY.FILES.CHANGE.PCT:"{#INSTANCE}"})/100'
                  name: 'CSV Archiver [{#INSTANCE}]: Daily CSV files increased by more than {$PANOS.CSV.DAY.FILES.CHANGE.PCT:"{#INSTANCE}"}%'
                  event_name: 'CSV Archiver [{#INSTANCE}]: Daily CSV files increased: {ITEM.LASTVALUE1} vs average {{?avg(/{HOST.HOST}/panos.csv.day.files[{#INSTANCE}],{$PANOS.CSV.DAY.FILES.BASELINE:"{#INSTANCE}"}:now-1d)}.fmtnum(0)}'
                  opdata: 'Files: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The number of files of the last complete day is much higher than the average of the previous days ({$PANOS.CSV.DAY.FILES.BASELINE:"{#INSTANCE}"}). Possible causes: traffic peak, attack, new rules or logging profiles.'
                  tags:
                    - tag: template
                      value: Pan-OS-CSV-Archiver
            - uuid: baa7f938a3d941bb9675ff5c4e6b833f
              name: 'CSV Archiver [{#INSTANCE}]: Destination free space'
              type: TRAP
              key: 'panos.csv.disk.free[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              units: B
              tags:
                - tag: component
                  value: storage
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
            - uuid: fa61b1d13e134df6b205710649b1a3bd
              name: 'CSV Archiver [{#INSTANCE}]: Source disk free space in %'
              type: TRAP
              key: 'panos.csv.disk.pfree[{#INSTANCE}]'
              delay: '0'
              history: 30d
              value_type: FLOAT
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              units: '%'
              description: 'Free space of the source volume as a percentage of its total size'
              tags:
                - tag: component
                  value: storage
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
              trigger_prototypes:
                - uuid: 7077bb3d9a144f91ac9c6138c89b6c25
                  expression: 'nodata(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.disk.pfree[{#INSTANCE}],{$PANOS.CSV.JOB.MAX.AGE:"{#INSTANCE}"})=1'
                  name: 'CSV Archiver [{#INSTANCE}]: Disk usage data missing'
                  priority: WARNING
                  description: 'The job runs but does not report the free space percentage: fsutil failed or is not allowed for the account running the task. The disk space alert cannot work.'
                  dependencies:
                    - name: 'CSV Archiver [{#INSTANCE}]: No recent job metrics'
                      expression: 'nodata(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.job.status[{#INSTANCE}],{$PANOS.CSV.JOB.MAX.AGE:"{#INSTANCE}"})=1'
                    - name: 'CSV Archiver [{#INSTANCE}]: Path rejected, not on a local disk'
                      expression: 'last(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.check.path[{#INSTANCE}])=0'
                  tags:
                    - tag: template
                      value: Pan-OS-CSV-Archiver
                - uuid: 4bd0916afb3441c4819b5f1afbebbfb1
                  expression: 'last(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.disk.pfree[{#INSTANCE}])<{$PANOS.CSV.DISK.MIN.PFREE:"{#INSTANCE}"}'
                  name: 'CSV Archiver [{#INSTANCE}]: Source disk free space below {$PANOS.CSV.DISK.MIN.PFREE:"{#INSTANCE}"}%'
                  opdata: 'Free: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'A file is archived only if its size plus DISK_RESERVE_BYTES is available: plan a manual rotation.'
                  tags:
                    - tag: template
                      value: Pan-OS-CSV-Archiver
            - uuid: f1088ab95c794193b4aa92c94bf67951
              name: 'CSV Archiver [{#INSTANCE}]: Source disk total size'
              type: TRAP
              key: 'panos.csv.disk.total[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              units: B
              description: 'Total size of the volume holding the source directory (fsutil volume diskfree)'
              tags:
                - tag: component
                  value: storage
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
            - uuid: 2b314d4ec7c94d82bababcf905dd6e8c
              name: 'CSV Archiver [{#INSTANCE}]: Files deferred'
              type: TRAP
              key: 'panos.csv.files.deferred[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              description: 'CSV files left for the next run because modified too recently (upload in progress)'
              tags:
                - tag: component
                  value: job
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
            - uuid: e823b997d3ea41e8a586d6149773b2a7
              name: 'CSV Archiver [{#INSTANCE}]: Files failed'
              type: TRAP
              key: 'panos.csv.files.failed[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              tags:
                - tag: component
                  value: job
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
            - uuid: 7bc1ff7a175843ac81cc0cd408e84602
              name: 'CSV Archiver [{#INSTANCE}]: Files found'
              type: TRAP
              key: 'panos.csv.files.found[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              tags:
                - tag: component
                  value: job
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
            - uuid: 11d627191e744e13935e209d843f3452
              name: 'CSV Archiver [{#INSTANCE}]: Files orphaned'
              type: TRAP
              key: 'panos.csv.files.orphaned[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              description: 'CSV files still present inside day folders after the automatic recovery attempt of the run'
              tags:
                - tag: component
                  value: job
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
              trigger_prototypes:
                - uuid: 63b4dedd206a4c7498530fda1eb85eca
                  expression: 'last(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.files.orphaned[{#INSTANCE}])>0'
                  name: 'CSV Archiver [{#INSTANCE}]: CSV files left inside archive folders'
                  priority: WARNING
                  description: 'CSV files remain inside archive folders after the automatic recovery of this run (archive again, or set aside an invalid archive). Review the local log and report\FAILED-JOB.txt in the day folder.'
                  tags:
                    - tag: template
                      value: Pan-OS-CSV-Archiver
            - uuid: 78fde2ef207a4146a0536572d4c8ce30
              name: 'CSV Archiver [{#INSTANCE}]: Files pending'
              type: TRAP
              key: 'panos.csv.files.pending[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              tags:
                - tag: component
                  value: job
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
              trigger_prototypes:
                - uuid: ef89c84245b84f8595b7aa045be99880
                  expression: 'count(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.files.pending[{#INSTANCE}],#2,"gt",{$PANOS.CSV.PENDING.MAX:"{#INSTANCE}"})=2'
                  name: 'CSV Archiver [{#INSTANCE}]: Source files pending on two consecutive runs'
                  priority: WARNING
                  description: 'CSV files are still in the source directory after two runs (failed, deferred or arriving continuously).'
                  tags:
                    - tag: template
                      value: Pan-OS-CSV-Archiver
            - uuid: b09fcd5d1ed245489e66ff6dc27a2f09
              name: 'CSV Archiver [{#INSTANCE}]: Files processed'
              type: TRAP
              key: 'panos.csv.files.processed[{#INSTANCE}]'
              delay: '0'
              history: 30d
              allowed_hosts: '{$PANOS.CSV.ALLOWED.HOSTS}'
              description: 'CSV files archived by the run'
              tags:
                - tag: component
                  value: job
                - tag: instance
                  value: '{#INSTANCE}'
                - tag: template
                  value: Pan-OS-CSV-Archiver
              trigger_prototypes:
                - uuid: 5d0c1c6f0b0e4a55a3f7a2b1c9e84d10
                  expression: 'max(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.files.processed[{#INSTANCE}],{$PANOS.CSV.NO.FILES.MAX.AGE:"{#INSTANCE}"})=0 and count(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.files.processed[{#INSTANCE}],#1:now-{$PANOS.CSV.NO.FILES.MAX.AGE:"{#INSTANCE}"})=1'
                  name: 'CSV Archiver [{#INSTANCE}]: No new CSV files for {$PANOS.CSV.NO.FILES.MAX.AGE:"{#INSTANCE}"}'
                  priority: HIGH
                  description: 'The job runs but no run has archived a file for {$PANOS.CSV.NO.FILES.MAX.AGE:"{#INSTANCE}"}: no new CSV reaches the source folder. Check the scheduled log export of the firewall, the FTP service and the network path to this server. Not evaluated until the instance has data older than this period. Adjust per instance with a context macro (maximum 30d, the item history).'
                  dependencies:
                    - name: 'CSV Archiver [{#INSTANCE}]: Last execution failed'
                      expression: 'last(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.job.status[{#INSTANCE}])=0'
                    - name: 'CSV Archiver [{#INSTANCE}]: No recent job metrics'
                      expression: 'nodata(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.job.status[{#INSTANCE}],{$PANOS.CSV.JOB.MAX.AGE:"{#INSTANCE}"})=1'
                    - name: 'CSV Archiver [{#INSTANCE}]: Path rejected, not on a local disk'
                      expression: 'last(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.check.path[{#INSTANCE}])=0'
                    - name: 'CSV Archiver [{#INSTANCE}]: Required programs missing'
                      expression: 'last(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.check.prereq[{#INSTANCE}])=0'
                  tags:
                    - tag: template
                      value: Pan-OS-CSV-Archiver
