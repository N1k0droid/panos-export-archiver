              expression: 'last(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.job.status[{#INSTANCE}])=3 and (now()-last(/PAN-OS CSV Archiver by Zabbix trapper/panos.csv.job.start[{#INSTANCE}]))>{$PANOS.CSV.JOB.MAX.DURATION:"{#INSTANCE}"}'
              name: 'CSV Archiver [{#INSTANCE}]: Job running too long'
              priority: HIGH
              description: 'The job reported Running for longer than {$PANOS.CSV.JOB.MAX.DURATION:"{#INSTANCE}"}, or it was killed before sending its final status.'
              tags:
                - tag: template
                  value: Pan-OS-CSV-Archiver
      tags:
        - tag: class
          value: backup
        - tag: target
          value: panos-csv-archiver
      macros:
        - macro: '{$PANOS.CSV.ALLOWED.HOSTS}'
          value: '0.0.0.0/0,::/0'
          description: 'Addresses allowed to send data (Zabbix trapper "Allowed hosts", CIDR allowed). Default = any address. Set it to the IP of the Windows server (or of the proxy). Must not be empty: an empty value rejects all data'
        - macro: '{$PANOS.CSV.ARCHIVE.ROTATION.AGE}'
          value: 365d
          description: 'Age of the oldest archived day after which a manual rotation is due'
        - macro: '{$PANOS.CSV.DAY.FILES.BASELINE}'
          value: 7d
          description: 'Period before the last day used as baseline for the daily file count'
        - macro: '{$PANOS.CSV.DAY.FILES.CHANGE.PCT}'
          value: '50'
          description: 'Change of the daily file count, in percent of the baseline average, that raises an alarm'
        - macro: '{$PANOS.CSV.DISK.MIN.PFREE}'
          value: '10'
          description: 'Free space warning threshold on the source volume, in percent of its size'
        - macro: '{$PANOS.CSV.JOB.MAX.AGE}'
          value: 26h
          description: 'Maximum time without any metric from the job'
        - macro: '{$PANOS.CSV.JOB.MAX.DURATION}'
          value: 8h
          description: 'Maximum duration of a run. Traffic logs (1500-1800 files of 40-50 MB a day) need hours: adjust per instance with a context macro, e.g. {$PANOS.CSV.JOB.MAX.DURATION:"fw01-wildfire"} = 1h'
        - macro: '{$PANOS.CSV.JOB.SUCCESS.MAX.AGE}'
          value: 26h
          description: 'Maximum age of the last successful run'
        - macro: '{$PANOS.CSV.NO.FILES.MAX.AGE}'
          value: 3d
          description: 'Maximum time without any archived CSV while the job keeps running (maximum 30d). Per instance: {$PANOS.CSV.NO.FILES.MAX.AGE:"fw01-wildfire"} = 14d'
        - macro: '{$PANOS.CSV.PENDING.MAX}'
          value: '0'
          description: 'Files allowed to remain in the source directory on two consecutive runs'
      valuemaps:
        - uuid: 3e4db10c1e9f4e6990ccaa006a970cad
          name: 'CSV Archiver check result'
          mappings:
            - value: '0'
              newvalue: Failed
            - value: '1'
              newvalue: OK
        - uuid: 43cf93c3f99b4738b47770a34a078db6
          name: 'CSV Archiver job status'
          mappings:
            - value: '0'
              newvalue: Failed
            - value: '1'
              newvalue: Success
            - value: '2'
              newvalue: Partial
            - value: '3'
              newvalue: Running
